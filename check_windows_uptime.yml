---
- name: Check Windows server uptime
  hosts: all
  gather_facts: true
  vars:
    reboot_warning_days: 30

  tasks:
    - name: Calculate uptime in days
      ansible.builtin.set_fact:
        uptime_days: "{{ ((ansible_uptime_seconds | int) / 86400) | round(2) }}"

    - name: Get last boot time
      ansible.windows.win_shell: (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToString("yyyy-MM-dd HH:mm")
      register: boot_time
      changed_when: false

    - name: Set last boot fact
      ansible.builtin.set_fact:
        last_boot: "{{ (boot_time.stdout | default(boot_time.stdout_lines | default(boot_time.output | default([''])) | join('\n'))) | trim }}"

    - name: Report uptime and status for each host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ 'WARNING' if (uptime_days | float > reboot_warning_days | float) else 'OK' }}
          - up {{ uptime_days }} days (last boot: {{ last_boot }})
